<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baton</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="split">
    <div class="left-column">
    <div class="card left">
      <button id="settings-gear" class="gear-btn" type="button" title="Settings">&#9881;</button>
      <h1 class="brand" id="brand-heading">What are we doing?</h1>
      <p class="user-line">{{ email }}</p>
      <div id="active-project-line" class="active-project-line" hidden>
        <span id="active-project-name" class="active-project-name"></span>
        <button id="close-project-btn" class="close-btn" type="button">Close</button>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-state-text">Set A GitHub Local Directory</p>
        <button id="open-root-btn" class="glass-btn" type="button">Open</button>
      </div>

      <div id="project-picker" class="project-picker" hidden>
        <h2 class="picker-heading">Which Project are we working today?</h2>
        <div class="scroll-wrap"><div id="project-list" class="project-list"></div></div>
      </div>

      <div id="main-flow" hidden>
        <form id="start-form">
          <textarea class="prompt-box" name="prompt" placeholder="Describe what you want to build…" required></textarea>
          <button type="submit" class="glass-btn">Start</button>
        </form>
        <div class="scroll-wrap"><div id="interview"></div></div>
      </div>

      <div id="session-status" hidden>
        <p id="phase-label" class="phase-label"></p>
        <div class="scroll-wrap"><div id="details-view" class="details-list"></div></div>
        <p id="session-error" class="session-error" hidden></p>
        <div id="session-error-actions" class="session-error-actions" hidden>
          <button id="github-login-btn" class="glass-btn" type="button" hidden>Login with GitHub</button>
          <button id="retry-btn" class="glass-btn" type="button">Retry</button>
        </div>
      </div>
    </div>
    <div id="prd-card" class="card left-secondary" hidden>
      <p class="console-title">To be implemented</p>
      <div class="scroll-wrap scroll-wrap-horizontal"><div id="prd-button-row" class="prd-button-row"></div></div>
    </div>
    </div>
    <div class="card middle">
      <p class="console-title">Output</p>
      <div class="scroll-wrap"><div id="console-output" class="console"></div></div>
    </div>
    <div class="card right">
      <p class="console-title">Sessions <span id="session-count" class="session-count"></span></p>
      <p id="usage-indicator" class="usage-indicator"></p>
      <div class="scroll-wrap"><div id="session-queue" class="session-queue"></div></div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 class="modal-heading">Root Directory</h2>
      <p id="current-root-dir" class="current-root-dir">No directory set.</p>
      <button id="modal-pick-btn" class="glass-btn" type="button">Choose Folder…</button>
      <button id="modal-close-btn" class="glass-btn modal-dismiss" type="button">Close</button>
    </div>
  </div>

  <script>
    let activeProject = null;
    let leftCardId = null;
    let currentLeftSession = null;
    const rightCards = new Map();

    const startForm = document.getElementById("start-form");
    const interviewEl = document.getElementById("interview");
    const emptyStateEl = document.getElementById("empty-state");
    const projectPickerEl = document.getElementById("project-picker");
    const projectListEl = document.getElementById("project-list");
    const mainFlowEl = document.getElementById("main-flow");
    const sessionStatusEl = document.getElementById("session-status");
    const activeProjectLineEl = document.getElementById("active-project-line");
    const activeProjectNameEl = document.getElementById("active-project-name");
    const settingsModalEl = document.getElementById("settings-modal");
    const currentRootDirEl = document.getElementById("current-root-dir");
    const brandHeadingEl = document.getElementById("brand-heading");
    const sessionQueueEl = document.getElementById("session-queue");
    const consoleOutputEl = document.getElementById("console-output");
    const sessionCountEl = document.getElementById("session-count");
    const usageIndicatorEl = document.getElementById("usage-indicator");
    const phaseLabelEl = document.getElementById("phase-label");
    const detailsViewEl = document.getElementById("details-view");
    const sessionErrorEl = document.getElementById("session-error");
    const sessionErrorActionsEl = document.getElementById("session-error-actions");
    const githubLoginBtn = document.getElementById("github-login-btn");
    const retryBtn = document.getElementById("retry-btn");
    const prdCardEl = document.getElementById("prd-card");
    const prdButtonRowEl = document.getElementById("prd-button-row");

    let knownRootDir = null;

    function autoGrow(el) {
      el.style.height = "auto";
      el.style.height = `${el.scrollHeight}px`;
    }

    const promptBoxEl = document.querySelector(".prompt-box");
    promptBoxEl.addEventListener("input", () => autoGrow(promptBoxEl));

    function resetPromptBox() {
      startForm.reset();
      promptBoxEl.style.height = "";
    }

    function initScrollWrap(wrap) {
      const target = wrap.firstElementChild;
      if (!target) return;
      const horizontal = wrap.classList.contains("scroll-wrap-horizontal");

      function ensurePill() {
        let pill = wrap.querySelector(".scroll-pill");
        if (!pill) {
          pill = document.createElement("div");
          pill.className = "scroll-pill";
          if (horizontal) pill.classList.add("scroll-pill-horizontal");
          wrap.appendChild(pill);
        }
        return pill;
      }

      function update() {
        const pill = ensurePill();
        if (horizontal) {
          const { scrollLeft, scrollWidth, clientWidth } = target;
          if (scrollWidth <= clientWidth + 1) {
            pill.classList.remove("visible");
            return;
          }
          const pillWidth = Math.max((clientWidth / scrollWidth) * clientWidth, 24);
          const maxLeft = clientWidth - pillWidth;
          const left = (scrollLeft / (scrollWidth - clientWidth)) * maxLeft;
          pill.style.width = `${pillWidth}px`;
          pill.style.left = `${left}px`;
          pill.classList.add("visible");
          return;
        }

        const { scrollTop, scrollHeight, clientHeight } = target;
        if (scrollHeight <= clientHeight + 1) {
          pill.classList.remove("visible");
          return;
        }
        const pillHeight = Math.max((clientHeight / scrollHeight) * clientHeight, 24);
        const maxTop = clientHeight - pillHeight;
        const top = (scrollTop / (scrollHeight - clientHeight)) * maxTop;
        pill.style.height = `${pillHeight}px`;
        pill.style.top = `${top}px`;
        pill.classList.add("visible");
      }

      let fadeTimer = null;
      target.addEventListener("scroll", () => {
        update();
        const pill = ensurePill();
        pill.classList.add("active");
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(() => pill.classList.remove("active"), 400);
      });

      new ResizeObserver(update).observe(target);
      new MutationObserver(update).observe(target, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["style"],
        characterData: true,
      });
      update();
    }

    document.querySelectorAll(".scroll-wrap").forEach(initScrollWrap);

    function setHeading(text) {
      brandHeadingEl.textContent = text;
    }

    function headingForPhase(phase) {
      return (
        {
          grilling: "Ongoing Grilling Session...",
          creating_prd: "Creating PRD...",
          creating_issues: "Creating Issues...",
          details: "Details",
        }[phase] || "What are we doing?"
      );
    }

    function phaseLabelText(phase) {
      return (
        {
          grilling: "Ongoing Grilling Session...",
          creating_prd: "Creating PRD...",
          creating_issues: "Creating Issues...",
          details: "Done",
        }[phase] || phase
      );
    }

    function showOnly(el) {
      [emptyStateEl, projectPickerEl, mainFlowEl, sessionStatusEl].forEach((e) => (e.hidden = e !== el));
    }

    function hueForCard(cardId) {
      return Math.round((cardId * 137.508) % 360);
    }

    function renderProjectList(projects) {
      projectListEl.innerHTML = "";
      projects.forEach((project) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "project-row";

        const name = document.createElement("span");
        name.className = "project-row-name";
        name.textContent = project.name;
        row.appendChild(name);

        const meta = document.createElement("span");
        meta.className = "project-row-meta";
        const opened = project.last_opened ? new Date(project.last_opened).toLocaleString() : "never opened";
        meta.textContent = `${project.branch || "?"} · ${opened}`;
        row.appendChild(meta);

        row.addEventListener("click", () => openProject(project.id));
        projectListEl.appendChild(row);
      });
    }

    async function openProject(projectId) {
      const res = await fetch(`/api/projects/${projectId}/open`, { method: "POST" });
      const data = await res.json();
      if (data.error) return;
      await activateProject(data.project);
    }

    async function activateProject(project) {
      activeProject = project;
      activeProjectNameEl.textContent = project.name;
      activeProjectLineEl.hidden = false;

      leftCardId = null;
      currentLeftSession = null;
      rightCards.clear();

      resetPromptBox();
      startForm.style.display = "";
      interviewEl.innerHTML = "";
      setHeading("What are we doing?");
      showOnly(mainFlowEl);

      await loadSessionQueue();
      await loadPrdList();
    }

    async function loadSessionQueue() {
      if (!activeProject) return;
      const res = await fetch(`/api/projects/${activeProject.id}/sessions`);
      const data = await res.json();
      rightCards.clear();
      (data.sessions || []).forEach((s) => rightCards.set(s.card_id, s));
      renderQueue();
    }

    function renderPrdList(prds) {
      prdButtonRowEl.innerHTML = "";
      prdCardEl.hidden = prds.length === 0;
      prds.forEach((prd) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "prd-btn";
        btn.textContent = `PRD: ${prd.number}`;
        prdButtonRowEl.appendChild(btn);
      });
    }

    async function loadPrdList() {
      if (!activeProject) return;
      const res = await fetch(`/api/projects/${activeProject.id}/prds`);
      const data = await res.json();
      renderPrdList(data.prds || []);
    }

    async function pollSessionQueueFreshness() {
      if (!activeProject) return;
      const res = await fetch(`/api/projects/${activeProject.id}/sessions`);
      const data = await res.json();
      // The focused card's badge comes from its live stream, not this poll --
      // a background session's badge only ever updates this way, since its
      // events aren't being tailed while a different card is focused.
      (data.sessions || []).forEach((s) => {
        if (s.card_id !== leftCardId) rightCards.set(s.card_id, s);
      });
      renderQueue();
    }

    async function closeActiveProject() {
      if (!activeProject) return;
      await fetch(`/api/projects/${activeProject.id}/close`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_state: {} }),
      });

      activeProject = null;
      leftCardId = null;
      currentLeftSession = null;
      rightCards.clear();
      resetPromptBox();
      startForm.style.display = "";
      interviewEl.innerHTML = "";
      activeProjectLineEl.hidden = true;
      prdButtonRowEl.innerHTML = "";
      prdCardEl.hidden = true;

      await loadAppState();
    }

    async function loadAppState() {
      const res = await fetch("/api/app-state");
      const state = await res.json();
      knownRootDir = state.root_dir;

      if (state.active_project) {
        await activateProject(state.active_project);
        return;
      }

      if (!state.root_dir) {
        showOnly(emptyStateEl);
        return;
      }

      renderProjectList(state.projects);
      showOnly(projectPickerEl);
    }

    function openSettingsModal() {
      currentRootDirEl.textContent = knownRootDir || "No directory set.";
      settingsModalEl.hidden = false;
    }

    function closeSettingsModal() {
      settingsModalEl.hidden = true;
    }

    async function pickRootDir() {
      const pickRes = await fetch("/api/settings/pick-folder", { method: "POST" });
      const { path } = await pickRes.json();
      if (!path) return;

      if (knownRootDir && knownRootDir !== path) {
        const confirmed = window.confirm(
          "Changing the root directory will wipe all saved project sessions. Continue?"
        );
        if (!confirmed) return;
      }

      const res = await fetch("/api/settings/root-dir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ root_dir: path, confirm: true }),
      });
      const data = await res.json();
      knownRootDir = data.root_dir;
      closeSettingsModal();
      await loadAppState();
    }

    document.getElementById("settings-gear").addEventListener("click", openSettingsModal);
    document.getElementById("open-root-btn").addEventListener("click", openSettingsModal);
    document.getElementById("modal-close-btn").addEventListener("click", closeSettingsModal);
    document.getElementById("modal-pick-btn").addEventListener("click", pickRootDir);
    document.getElementById("close-project-btn").addEventListener("click", closeActiveProject);

    let eventSource = null;
    let currentTextEl = null;
    const cardSnapshots = new Map(); // card_id -> latest {phase, interview, details, error, needs_github_login}

    function appendConsoleLine(text, className) {
      const p = document.createElement("p");
      if (className) p.className = className;
      p.textContent = text;
      consoleOutputEl.appendChild(p);
      consoleOutputEl.scrollTop = consoleOutputEl.scrollHeight;
      return p;
    }

    function connectStream(cardId) {
      if (eventSource) eventSource.close();
      consoleOutputEl.innerHTML = "";
      currentTextEl = null;
      const es = new EventSource(`/api/sessions/${cardId}/stream`);
      eventSource = es;
      es.onmessage = (e) => handleStreamEvent(cardId, es, JSON.parse(e.data));
      es.onerror = () => {
        es.close();
        if (eventSource === es) eventSource = null;
      };
    }

    function handleStreamEvent(cardId, es, event) {
      // Bookkeeping events apply to `cardId` regardless of which card is
      // currently focused -- a minimized session keeps advancing in the
      // background and its snapshot must stay current for when it's refocused.
      if (event.type === "turn") {
        applyTurn(cardId, event);
        return;
      }

      if (event.type === "done") {
        finishCard(cardId);
        es.close();
        if (eventSource === es) eventSource = null;
        return;
      }

      if (event.type === "usage") return;

      // Everything else is pure console streaming for the currently focused
      // session -- ignore stray events from a connection that's since been replaced.
      if (cardId !== leftCardId) return;

      if (event.type === "phase") {
        currentTextEl = null;
        appendConsoleLine(headingForPhase(event.phase), "console-phase");
        setHeading(headingForPhase(event.phase));
        return;
      }

      if (event.type === "text") {
        if (!currentTextEl) currentTextEl = appendConsoleLine("", "console-text");
        currentTextEl.textContent += event.text;
        consoleOutputEl.scrollTop = consoleOutputEl.scrollHeight;
        return;
      }

      if (event.type === "action") {
        currentTextEl = null;
        appendConsoleLine(event.summary, "console-action");
      }
    }

    function applyTurn(cardId, event) {
      if (cardId === leftCardId) currentTextEl = null;
      const snapshot = {
        card_id: cardId,
        phase: event.phase,
        interview: event.interview,
        details: event.details,
        error: event.error,
        needs_github_login: event.needs_github_login,
      };
      cardSnapshots.set(cardId, snapshot);

      if (leftCardId !== cardId) return;

      if (event.phase === "grilling") {
        if (event.error) {
          showGrillingError(event.error);
          return;
        }
        currentLeftSession = { card_id: cardId, phase: "grilling", interview: event.interview };
        renderInterview({ preamble: event.interview.preamble, sections: event.interview.sections });
        return;
      }

      currentLeftSession = snapshot;
      setHeading(headingForPhase(event.phase));
      showOnly(sessionStatusEl);
      renderSessionStatus(snapshot);
    }

    function finishCard(cardId) {
      const snapshot = cardSnapshots.get(cardId);
      if (!snapshot) return;

      rightCards.set(cardId, snapshot);
      if (leftCardId === cardId) {
        leftCardId = null;
        currentLeftSession = null;
        resetPromptBox();
        startForm.style.display = "";
        interviewEl.innerHTML = "";
        setHeading("What are we doing?");
        showOnly(mainFlowEl);
      }
      renderQueue();
    }

    function renderManualReply(onSend) {
      const wrap = document.createElement("div");
      wrap.className = "manual-reply";

      const label = document.createElement("p");
      label.className = "manual-reply-label";
      label.textContent = "Or type a reply";
      wrap.appendChild(label);

      const box = document.createElement("textarea");
      box.className = "answer-box";
      box.placeholder = "Type here…";
      box.addEventListener("input", () => autoGrow(box));
      wrap.appendChild(box);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "glass-btn";
      btn.textContent = "Send";
      btn.style.marginTop = "12px";
      btn.addEventListener("click", () => onSend(box.value, btn));
      wrap.appendChild(btn);

      return wrap;
    }

    function showGrillingError(message) {
      let err = interviewEl.querySelector(".session-error");
      if (!err) {
        err = document.createElement("p");
        err.className = "session-error";
        interviewEl.prepend(err);
      }
      err.textContent = message;
    }

    async function sendReply(replyText, triggerBtn) {
      if (!replyText.trim() || leftCardId === null) return;
      triggerBtn.disabled = true;
      const res = await fetch("/api/session/continue", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: leftCardId, reply: replyText }),
      });
      const data = await res.json();
      triggerBtn.disabled = false;

      if (data.error) {
        showGrillingError(data.error);
      }
      // Otherwise, the reply's effect (next questions, or hand-off to the next
      // phase) arrives asynchronously over the already-open event stream.
    }

    function renderInterview(data) {
      interviewEl.innerHTML = "";
      const answers = {};

      if (data.preamble) {
        const p = document.createElement("p");
        p.className = "preamble";
        p.textContent = data.preamble;
        interviewEl.appendChild(p);
      }

      (data.sections || []).forEach((section) => {
        if (section.heading) {
          const h = document.createElement("h3");
          h.className = "section-heading";
          h.textContent = section.heading;
          interviewEl.appendChild(h);
        }

        section.questions.forEach((q) => {
          const block = document.createElement("div");
          block.className = "question-block";

          const label = document.createElement("p");
          label.className = "question-text";
          label.textContent = q.text;
          block.appendChild(label);

          if (q.options) {
            const optWrap = document.createElement("div");
            optWrap.className = "option-list";
            q.options.forEach((opt) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "option-btn";
              btn.textContent = opt;
              btn.addEventListener("click", () => {
                answers[q.id] = opt;
                optWrap.querySelectorAll(".option-btn").forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
              });
              optWrap.appendChild(btn);
            });
            block.appendChild(optWrap);
          } else {
            const input = document.createElement("textarea");
            input.className = "answer-box";
            input.addEventListener("input", () => {
              answers[q.id] = input.value;
              autoGrow(input);
            });
            block.appendChild(input);
          }

          interviewEl.appendChild(block);
        });
      });

      if (data.sections && data.sections.length) {
        const continueBtn = document.createElement("button");
        continueBtn.type = "button";
        continueBtn.className = "glass-btn";
        continueBtn.textContent = "Continue";
        continueBtn.addEventListener("click", () => {
          const orderedIds = data.sections.flatMap((s) => s.questions.map((q) => q.id));
          const replyText = orderedIds
            .map((id, i) => `${i + 1}. ${answers[id] || "(no answer)"}`)
            .join("\n");
          sendReply(replyText, continueBtn);
        });
        interviewEl.appendChild(continueBtn);
      }

      interviewEl.appendChild(renderManualReply(sendReply));
    }

    function renderDetailsList(details) {
      const wrap = document.createElement("div");
      if (details && details.prd) {
        const p = document.createElement("p");
        p.textContent = `PRD #${details.prd.number}: ${details.prd.title}`;
        wrap.appendChild(p);
      }
      (details && details.issues ? details.issues : []).forEach((issue) => {
        const p = document.createElement("p");
        p.textContent = `Issue #${issue.number}: ${issue.title}`;
        wrap.appendChild(p);
      });
      return wrap;
    }

    function renderSessionStatus(session) {
      detailsViewEl.innerHTML = "";
      sessionErrorEl.hidden = true;
      sessionErrorActionsEl.hidden = true;
      githubLoginBtn.hidden = true;

      phaseLabelEl.textContent = session.error ? "Error" : phaseLabelText(session.phase);

      if (session.error) {
        sessionErrorEl.hidden = false;
        sessionErrorEl.textContent = session.error;
        sessionErrorActionsEl.hidden = false;
        githubLoginBtn.hidden = !session.needs_github_login;
        return;
      }

      if (session.phase === "details" && session.details) {
        detailsViewEl.appendChild(renderDetailsList(session.details));
      }
    }

    function renderLeftSession(session) {
      currentLeftSession = session;
      leftCardId = session.card_id;

      if (session.phase === "grilling") {
        startForm.style.display = "none";
        setHeading(headingForPhase("grilling"));
        showOnly(mainFlowEl);
        renderInterview(session.interview || { preamble: "", sections: [] });
        return;
      }

      setHeading(headingForPhase(session.phase));
      showOnly(sessionStatusEl);
      renderSessionStatus(session);
    }

    function badgeForSession(session) {
      if (session.error) return "!";
      if (session.phase === "details" && session.details) {
        const count = (session.details.issues || []).length + (session.details.prd ? 1 : 0);
        return String(count);
      }
      return "";
    }

    function renderQueue() {
      sessionQueueEl.innerHTML = "";
      const total = rightCards.size + (leftCardId !== null ? 1 : 0);
      sessionCountEl.textContent = total > 0 ? `(${total})` : "";

      rightCards.forEach((session) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "session-card";
        const hue = hueForCard(session.card_id);
        card.style.background = `hsla(${hue}, 70%, 55%, 0.18)`;
        card.style.borderColor = `hsla(${hue}, 70%, 55%, 0.45)`;

        const dot = document.createElement("span");
        dot.className = "session-card-dot";
        dot.classList.toggle("session-card-dot-error", Boolean(session.error));
        card.appendChild(dot);

        const label = document.createElement("span");
        label.className = "session-card-phase";
        label.textContent = session.error ? "Error" : phaseLabelText(session.phase);
        card.appendChild(label);

        const badge = badgeForSession(session);
        if (badge) {
          const badgeEl = document.createElement("span");
          badgeEl.className = "session-card-badge";
          badgeEl.textContent = badge;
          card.appendChild(badgeEl);
        }

        card.addEventListener("click", () => focusCard(session.card_id));
        sessionQueueEl.appendChild(card);
      });
    }

    function focusCard(cardId) {
      const session = rightCards.get(cardId);
      if (!session) return;
      rightCards.delete(cardId);

      if (leftCardId !== null && currentLeftSession) {
        rightCards.set(leftCardId, currentLeftSession);
      }

      renderLeftSession(session);
      renderQueue();
      connectStream(cardId);
    }

    async function retryCard(cardId) {
      await fetch(`/api/sessions/${cardId}/retry`, { method: "POST" });
      connectStream(cardId);
    }

    retryBtn.addEventListener("click", () => {
      if (leftCardId === null) return;
      retryCard(leftCardId);
    });

    githubLoginBtn.addEventListener("click", async () => {
      await fetch("/api/github-login", { method: "POST" });
      pollGithubLogin();
    });

    function pollGithubLogin() {
      const cardId = leftCardId;
      const interval = setInterval(async () => {
        const res = await fetch("/api/github-auth-status");
        const { logged_in } = await res.json();
        if (!logged_in) return;
        clearInterval(interval);
        if (leftCardId !== cardId) return;
        retryCard(cardId);
      }, 3000);
    }

    startForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = startForm.prompt.value;
      const submitBtn = startForm.querySelector("button");
      submitBtn.disabled = true;
      const res = await fetch("/api/session/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      submitBtn.disabled = false;
      if (data.error) {
        showGrillingError(data.error);
        return;
      }
      leftCardId = data.card_id;
      currentLeftSession = { card_id: data.card_id, phase: "grilling", interview: { preamble: "", sections: [] } };
      startForm.style.display = "none";
      setHeading(headingForPhase("grilling"));
      renderInterview({ preamble: "", sections: [] });
      connectStream(data.card_id);
    });

    async function refreshUsage() {
      const res = await fetch("/api/usage");
      const data = await res.json();
      if (data.five_hour_pct == null && data.seven_day_pct == null) {
        usageIndicatorEl.textContent = "";
        return;
      }
      const fmt = (v) => (v == null ? "—" : `${Math.round(v)}%`);
      usageIndicatorEl.textContent = `5h ${fmt(data.five_hour_pct)} · 7d ${fmt(data.seven_day_pct)}`;
    }
    setInterval(refreshUsage, 8000);
    refreshUsage();
    setInterval(pollSessionQueueFreshness, 4000);
    setInterval(loadPrdList, 30000);

    loadAppState();
  </script>
</body>
</html>
